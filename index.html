<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busam Financials</title>

  <!-- Anti-indexing / Anti-AI crawlers -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="bingbot" content="noindex, nofollow" />
  <meta name="GPTBot" content="noindex, nofollow" />
  <meta name="ClaudeBot" content="noindex, nofollow" />
  <meta name="CCBot" content="noindex, nofollow" />
  <meta name="Google-Extended" content="noindex, nofollow" />
  <meta name="Anthropic-AI" content="noindex, nofollow" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0e1117; font-family: 'Segoe UI', sans-serif; color: #e0e0e0; }
    ::-webkit-scrollbar { width: 6px; } 
    ::-webkit-scrollbar-track { background: #0e1117; }
    ::-webkit-scrollbar-thumb { background: #2a2f3e; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PASSWORD = "Busam@2024";
    const USERS = ["Chandra", "Gopi"];
    const CATEGORIES = [
      "Common from Common Account",
      "Common from Personal Card",
      "Personal from Common Account",
    ];
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyEZJDCWxY9YwWBK3lYTQgdeEG_HJnnVj-UVulGueZ9TeSfhEreHSULZqD38RE0PliJ6Q/exec";

    function parseSMS(text) {
      const amtMatch = text.match(/(?:debited by|credited by|Rs\.?|INR)\s*([\d,]+(?:\.\d+)?)/i);
      const amount = amtMatch ? parseFloat(amtMatch[1].replace(/,/g, "")) : null;
      const upiMatch = text.match(/towards\s+([^\s.]+)/i);
      const payee = upiMatch ? upiMatch[1] : null;
      const type = /debited/i.test(text) ? "debit" : "credit";
      const bankMatch = text.match(/(IndusInd|HDFC|ICICI|SBI|Axis|Kotak|Yes Bank|IDFC)/i);
      const bank = bankMatch ? bankMatch[1] : "Bank Alert";
      const dateMatch = text.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      let date = new Date().toISOString().split("T")[0];
      if (dateMatch) {
        const [, d, m, y] = dateMatch;
        date = `${y.length === 2 ? "20" + y : y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
      }
      return { amount, payee, type, bank, date };
    }

    const fmtDate = (iso) => {
      if (!iso) return "—";
      return new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
    };
    const fmtAmt = (n) => new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 }).format(n || 0);

    // ── Password Screen ──────────────────────────────────────────────────────
    function PasswordScreen({ onUnlock }) {
      const [pw, setPw] = useState("");
      const [error, setError] = useState("");
      const [show, setShow] = useState(false);

      const attempt = () => {
        if (pw === PASSWORD) { onUnlock(); }
        else { setError("Incorrect password. Try again."); setPw(""); }
      };

      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0e1117" }}>
          <div style={{ background: "#161b26", border: "1px solid #1e2535", borderRadius: 20, padding: "40px 36px", width: "100%", maxWidth: 380, textAlign: "center" }}>
            <div style={{ width: 56, height: 56, borderRadius: 14, background: "linear-gradient(135deg,#f5a623,#e07b00)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, fontWeight: 900, color: "#fff", margin: "0 auto 20px" }}>₹</div>
            <h1 style={{ fontSize: 22, fontWeight: 800, color: "#fff", marginBottom: 6 }}>Busam Financials</h1>
            <p style={{ fontSize: 13, color: "#555", marginBottom: 28 }}>Private — Authorized Access Only</p>
            <div style={{ position: "relative", marginBottom: 12 }}>
              <input
                type={show ? "text" : "password"}
                placeholder="Enter password"
                value={pw}
                onChange={e => { setPw(e.target.value); setError(""); }}
                onKeyDown={e => e.key === "Enter" && attempt()}
                style={{ width: "100%", background: "#0e1117", border: "1px solid #2a2f3e", borderRadius: 10, padding: "12px 44px 12px 16px", color: "#e0e0e0", fontSize: 15, outline: "none" }}
              />
              <button onClick={() => setShow(!show)} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "#555", cursor: "pointer", fontSize: 16 }}>
                {show ? "🙈" : "👁️"}
              </button>
            </div>
            {error && <p style={{ color: "#ff6b6b", fontSize: 13, marginBottom: 12 }}>{error}</p>}
            <button onClick={attempt} style={{ width: "100%", padding: "12px", background: "linear-gradient(135deg,#f5a623,#e07b00)", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>
              Unlock App
            </button>
            <p style={{ marginTop: 20, fontSize: 11, color: "#333" }}>🔒 Private & Secure · Not indexed by search engines</p>
          </div>
        </div>
      );
    }

    // ── Stat Card ────────────────────────────────────────────────────────────
    function StatCard({ label, amount, color }) {
      return (
        <div style={{ flex: 1, padding: "12px 14px", borderRight: "1px solid #1e2535", display: "flex", flexDirection: "column", gap: 3 }}>
          <span style={{ fontSize: 9, color: "#555", textTransform: "uppercase", letterSpacing: 0.8, fontWeight: 600 }}>{label}</span>
          <span style={{ fontSize: 13, fontWeight: 700, color: color || "#e0e0e0" }}>{fmtAmt(amount)}</span>
        </div>
      );
    }

    // ── Transaction Card ─────────────────────────────────────────────────────
    function TxnCard({ t }) {
      const catColor = t.category?.includes("Personal") ? "#ff6b6b" : t.category?.includes("Card") ? "#f5a623" : "#888";
      const catBg = t.category?.includes("Personal") ? "#ff6b6b15" : t.category?.includes("Card") ? "#f5a62315" : "#1e2535";
      return (
        <div style={{ background: "#161b26", border: "1px solid #1e2535", borderRadius: 12, padding: "14px 18px", marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
          <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
            <div style={{ width: 34, height: 34, borderRadius: 9, background: "#ff6b6b22", color: "#ff6b6b", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, fontWeight: 900, flexShrink: 0 }}>↑</div>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>{t.payee || "Expense"}</div>
              <div style={{ fontSize: 11, color: "#555", marginTop: 2 }}>{fmtDate(t.date)} · {t.bank || "—"} · by {t.addedby || t.addedBy || "—"}</div>
              {t.note && t.note !== "N/A" && <div style={{ fontSize: 12, color: "#888", marginTop: 4 }}>📝 {t.note}</div>}
              <div style={{ display: "inline-block", marginTop: 6, fontSize: 11, padding: "3px 10px", borderRadius: 20, background: catBg, color: catColor }}>{t.category}</div>
            </div>
          </div>
          <div style={{ fontSize: 15, fontWeight: 800, color: "#ff6b6b", flexShrink: 0 }}>−{fmtAmt(t.amount)}</div>
        </div>
      );
    }

    // ── Main App ─────────────────────────────────────────────────────────────
    function App() {
      const [unlocked, setUnlocked] = useState(false);
      const [transactions, setTransactions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState("add");
      const [user, setUser] = useState("Chandra");

      const [smsText, setSmsText] = useState("");
      const [parsed, setParsed] = useState(null);
      const [category, setCategory] = useState(CATEGORIES[0]);
      const [note, setNote] = useState("");
      const [saving, setSaving] = useState(false);
      const [msg, setMsg] = useState("");

      const [filterCat, setFilterCat] = useState("All");
      const [filterUser, setFilterUser] = useState("All");
      const [filterMonth, setFilterMonth] = useState("");

      const [aiQuery, setAiQuery] = useState("");
      const [aiHistory, setAiHistory] = useState([]);
      const [aiLoading, setAiLoading] = useState(false);

      const fetchLedger = async () => {
        try {
          const res = await fetch(SHEET_API_URL);
          const data = await res.json();
          setTransactions(Array.isArray(data) ? [...data].reverse() : []);
        } catch (e) {
          console.error("Sync error:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { if (unlocked) fetchLedger(); }, [unlocked]);

      const handleParse = (e) => { if (e) e.preventDefault(); setParsed(parseSMS(smsText)); setMsg(""); };

      const handleAdd = async () => {
        if (!parsed?.amount) return;
        setSaving(true); setMsg("");
        const txn = {
          id: Date.now().toString(),
          date: parsed.date,
          amount: parsed.amount,
          type: parsed.type,
          payee: parsed.payee || "Unknown",
          bank: parsed.bank,
          category,
          note: note || "N/A",
          addedBy: user,
        };
        const prev = [...transactions];
        setTransactions([txn, ...transactions]);
        try {
          const payload = encodeURIComponent(JSON.stringify(txn));
          await new Promise((resolve) => {
            const img = new Image();
            const timer = setTimeout(() => resolve("timeout"), 5000);
            img.onload = img.onerror = () => { clearTimeout(timer); resolve("done"); };
            img.src = `${SHEET_API_URL}?payload=${payload}`;
          });
          setSmsText(""); setParsed(null); setNote(""); setCategory(CATEGORIES[0]);
          setMsg(`✅ Saved: ${fmtAmt(txn.amount)} — syncing sheet…`);
          setTimeout(fetchLedger, 3000);
        } catch (err) {
          setTransactions(prev);
          setMsg("❌ Save failed: " + err.message);
        } finally {
          setSaving(false);
        }
      };

      const handleAskAI = async () => {
        if (!aiQuery.trim()) return;
        setAiLoading(true);
        const question = aiQuery.trim();
        setAiQuery("");
        const newHistory = [...aiHistory, { role: "user", content: question }];
        setAiHistory(newHistory);
        const context = `You are a finance assistant for Busam Financials used by Chandra and Gopi. Transaction data: ${JSON.stringify(transactions.slice(0, 100))}. Categories: "Common from Common Account", "Common from Personal Card", "Personal from Common Account". Be concise and use ₹ formatting.`;
        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, system: context, messages: newHistory }),
          });
          const data = await res.json();
          const reply = data.content?.[0]?.text || "Sorry, no response.";
          setAiHistory([...newHistory, { role: "assistant", content: reply }]);
        } catch {
          setAiHistory([...newHistory, { role: "assistant", content: "❌ AI error. Try again." }]);
        } finally {
          setAiLoading(false);
        }
      };

      const filtered = transactions.filter(t => {
        if (filterCat !== "All" && t.category !== filterCat) return false;
        if (filterUser !== "All" && (t.addedby || t.addedBy) !== filterUser) return false;
        if (filterMonth && t.date && !t.date.startsWith(filterMonth)) return false;
        return true;
      });

      const totalDebit = filtered.reduce((s, t) => s + (t.amount || 0), 0);
      const catTotal = (cat) => transactions.filter(t => t.category === cat).reduce((s, t) => s + (t.amount || 0), 0);

      const S = {
        card: { background: "#161b26", border: "1px solid #1e2535", borderRadius: 16, padding: 20, marginBottom: 16 },
        label: { display: "block", fontSize: 11, color: "#666", textTransform: "uppercase", letterSpacing: 0.6, marginBottom: 6, fontWeight: 600 },
        select: { width: "100%", background: "#0e1117", border: "1px solid #2a2f3e", borderRadius: 8, padding: "9px 12px", color: "#e0e0e0", fontSize: 14, outline: "none" },
        input: { width: "100%", background: "#0e1117", border: "1px solid #2a2f3e", borderRadius: 8, padding: "9px 12px", color: "#e0e0e0", fontSize: 14, outline: "none", boxSizing: "border-box" },
        tab: (active) => ({ padding: "12px 16px", border: "none", background: "transparent", color: active ? "#f5a623" : "#555", cursor: "pointer", fontSize: 13, fontWeight: active ? 700 : 400, borderBottom: `2px solid ${active ? "#f5a623" : "transparent"}` }),
        userBtn: (active) => ({ padding: "6px 14px", border: `1px solid ${active ? "#f5a623" : "#2a2f3e"}`, borderRadius: 20, background: active ? "#f5a62320" : "transparent", color: active ? "#f5a623" : "#888", cursor: "pointer", fontSize: 12, fontWeight: active ? 700 : 400 }),
      };

      if (!unlocked) return <PasswordScreen onUnlock={() => setUnlocked(true)} />;

      if (loading) return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <p style={{ color: "#f5a623", fontSize: 14 }}>Syncing with Google Sheets…</p>
        </div>
      );

      return (
        <div style={{ fontFamily: "'Segoe UI',sans-serif", background: "#0e1117", minHeight: "100vh", color: "#e0e0e0", paddingBottom: 48 }}>

          {/* Header */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px", background: "#161b26", borderBottom: "1px solid #1e2535" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ width: 40, height: 40, borderRadius: 10, background: "linear-gradient(135deg,#f5a623,#e07b00)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, fontWeight: 900, color: "#fff" }}>₹</div>
              <div>
                <h1 style={{ fontSize: 18, fontWeight: 800, color: "#fff", letterSpacing: -0.5 }}>Busam Financials</h1>
                <p style={{ fontSize: 11, color: "#555" }}>Private Cloud Tracker</p>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              {USERS.map(u => <button key={u} style={S.userBtn(user === u)} onClick={() => setUser(u)}>{u}</button>)}
            </div>
          </div>

          {/* Stats */}
          <div style={{ display: "flex", background: "#13181f", borderBottom: "1px solid #1e2535" }}>
            <StatCard label="Common / Common" amount={catTotal(CATEGORIES[0])} color="#e0e0e0" />
            <StatCard label="Common / Card" amount={catTotal(CATEGORIES[1])} color="#f5a623" />
            <StatCard label="Personal / Common" amount={catTotal(CATEGORIES[2])} color="#ff6b6b" />
          </div>

          {/* Tabs */}
          <div style={{ display: "flex", background: "#161b26", borderBottom: "1px solid #1e2535", paddingLeft: 8 }}>
            <button style={S.tab(tab === "add")} onClick={() => setTab("add")}>+ Parse SMS</button>
            <button style={S.tab(tab === "list")} onClick={() => setTab("list")}>📋 Live Ledger</button>
            <button style={S.tab(tab === "ai")} onClick={() => setTab("ai")}>🤖 Ask AI</button>
          </div>

          <div style={{ padding: "20px 16px", maxWidth: 760, margin: "0 auto" }}>

            {/* ── ADD TAB ── */}
            {tab === "add" && (
              <div style={S.card}>
                <h2 style={{ fontSize: 15, fontWeight: 700, color: "#fff", marginBottom: 4 }}>📱 Parse Bank SMS</h2>
                <p style={{ fontSize: 12, color: "#555", marginBottom: 14 }}>Logging as <strong style={{ color: "#f5a623" }}>{user}</strong></p>
                <label style={S.label}>Bank SMS Text</label>
                <textarea style={{ width: "100%", background: "#0e1117", border: "1px solid #2a2f3e", borderRadius: 10, padding: "12px 14px", color: "#e0e0e0", fontSize: 13, resize: "vertical", boxSizing: "border-box", fontFamily: "monospace", outline: "none" }}
                  rows={5} placeholder="Paste your bank alert SMS here…" value={smsText} onChange={e => setSmsText(e.target.value)} />
                <button type="button" onClick={handleParse} style={{ marginTop: 12, padding: "10px 22px", background: "linear-gradient(135deg,#f5a623,#e07b00)", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
                  🔍 Extract Details
                </button>

                {parsed && (
                  <div style={{ marginTop: 20, background: "#0e1117", borderRadius: 12, padding: 18, border: "1px solid #2a2f3e" }}>
                    <p style={{ fontSize: 13, fontWeight: 700, color: "#f5a623", marginBottom: 14 }}>Extracted Data</p>
                    {[["Date", fmtDate(parsed.date), null], ["Amount", fmtAmt(parsed.amount), "#ff6b6b"], ["Payee", parsed.payee || "—", null], ["Bank", parsed.bank, null]].map(([l, v, c]) => (
                      <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: "1px solid #1a1f2e" }}>
                        <span style={{ fontSize: 11, color: "#555", textTransform: "uppercase" }}>{l}</span>
                        <span style={{ fontSize: 13, fontWeight: 600, color: c || "#e0e0e0" }}>{v}</span>
                      </div>
                    ))}
                    <div style={{ marginTop: 14 }}>
                      <label style={S.label}>Category</label>
                      <select style={S.select} value={category} onChange={e => setCategory(e.target.value)}>
                        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div style={{ marginTop: 12 }}>
                      <label style={S.label}>Note</label>
                      <input style={S.input} placeholder="e.g. Groceries, fuel…" value={note} onChange={e => setNote(e.target.value)} />
                    </div>
                    <button type="button" onClick={handleAdd} disabled={saving} style={{ marginTop: 16, padding: "10px 24px", background: saving ? "#333" : "linear-gradient(135deg,#51cf66,#2f9e44)", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, fontSize: 14, cursor: saving ? "not-allowed" : "pointer" }}>
                      {saving ? "Saving…" : "🚀 Save to Google Sheet"}
                    </button>
                  </div>
                )}
                {msg && <p style={{ marginTop: 14, fontSize: 13, fontWeight: 600, textAlign: "center", color: msg.startsWith("✅") ? "#51cf66" : "#ff6b6b" }}>{msg}</p>}
              </div>
            )}

            {/* ── LEDGER TAB ── */}
            {tab === "list" && (
              <>
                <div style={S.card}>
                  <h2 style={{ fontSize: 15, fontWeight: 700, color: "#fff", marginBottom: 14 }}>📋 Transaction Ledger</h2>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                    <div style={{ flex: 1, minWidth: 130 }}>
                      <label style={S.label}>Category</label>
                      <select style={S.select} value={filterCat} onChange={e => setFilterCat(e.target.value)}>
                        <option value="All">All Categories</option>
                        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div style={{ flex: 1, minWidth: 110 }}>
                      <label style={S.label}>Added By</label>
                      <select style={S.select} value={filterUser} onChange={e => setFilterUser(e.target.value)}>
                        <option value="All">All Users</option>
                        {USERS.map(u => <option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                    <div style={{ flex: 1, minWidth: 110 }}>
                      <label style={S.label}>Month</label>
                      <input type="month" style={S.input} value={filterMonth} onChange={e => setFilterMonth(e.target.value)} />
                    </div>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 14, fontSize: 13, fontWeight: 600 }}>
                    <span style={{ color: "#ff6b6b" }}>Total: {fmtAmt(totalDebit)}</span>
                    <span style={{ color: "#444" }}>{filtered.length} entries</span>
                  </div>
                </div>
                {filtered.length === 0
                  ? <div style={{ textAlign: "center", color: "#333", padding: 60 }}>No transactions found.</div>
                  : filtered.map(t => <TxnCard key={t.id || Math.random()} t={t} />)
                }
              </>
            )}

            {/* ── AI TAB ── */}
            {tab === "ai" && (
              <div style={S.card}>
                <h2 style={{ fontSize: 15, fontWeight: 700, color: "#fff", marginBottom: 4 }}>🤖 Ask AI</h2>
                <p style={{ fontSize: 12, color: "#555", marginBottom: 16 }}>Ask anything about your transactions</p>
                <div style={{ maxHeight: 360, overflowY: "auto", marginBottom: 16, display: "flex", flexDirection: "column", gap: 10 }}>
                  {aiHistory.length === 0 && (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                      {["How much did Chandra spend this month?", "Total Common from Personal Card?", "Who spent more?", "List Personal from Common entries"].map(q => (
                        <button key={q} onClick={() => setAiQuery(q)} style={{ padding: "7px 12px", background: "#1e2535", border: "1px solid #2a2f3e", borderRadius: 20, color: "#aaa", fontSize: 12, cursor: "pointer" }}>{q}</button>
                      ))}
                    </div>
                  )}
                  {aiHistory.map((m, i) => (
                    <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
                      <div style={{ maxWidth: "80%", padding: "10px 14px", borderRadius: m.role === "user" ? "14px 14px 4px 14px" : "14px 14px 14px 4px", background: m.role === "user" ? "#f5a62325" : "#1e2535", border: `1px solid ${m.role === "user" ? "#f5a62340" : "#2a2f3e"}`, color: "#e0e0e0", fontSize: 13, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{m.content}</div>
                    </div>
                  ))}
                  {aiLoading && <div style={{ padding: "10px 14px", background: "#1e2535", borderRadius: "14px 14px 14px 4px", color: "#666", fontSize: 13, width: "fit-content" }}>Thinking…</div>}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <input style={{ ...S.input, flex: 1 }} placeholder="Ask about your finances…" value={aiQuery} onChange={e => setAiQuery(e.target.value)} onKeyDown={e => e.key === "Enter" && !aiLoading && handleAskAI()} />
                  <button type="button" onClick={handleAskAI} disabled={aiLoading || !aiQuery.trim()} style={{ padding: "9px 16px", background: "linear-gradient(135deg,#f5a623,#e07b00)", border: "none", borderRadius: 8, color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer", flexShrink: 0 }}>Ask</button>
                </div>
                {aiHistory.length > 0 && <button onClick={() => setAiHistory([])} style={{ marginTop: 10, background: "none", border: "none", color: "#444", fontSize: 12, cursor: "pointer" }}>Clear chat</button>}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
